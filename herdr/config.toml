onboarding = false

[terminal]
new_cwd = "follow"

[ui]
# 像 Zellij 一样，直接创建标签页，稍后再命名
prompt_new_tab_name = false

# 默认隐藏侧栏，需要时用 Ctrl+n b 展开
sidebar_start_collapsed = true
sidebar_collapsed_mode = "hidden"

pane_borders = "always"
hide_tab_bar_when_single_tab = false

[keys]
prefix = "ctrl+n"

# 窗格：保留你在 Zellij 中常用的动作键
split_vertical = ["prefix+r", "alt+n"]
split_horizontal = "prefix+d"
close_pane = "prefix+x"
zoom = "prefix+f"
rename_pane = "prefix+c"
cycle_pane_next = "prefix+p"

# 切换窗格：Alt+h/j/k/l 或 Alt+方向键。
focus_pane_left = ["prefix+h", "alt+h", "alt+left"]
focus_pane_down = ["alt+j", "alt+down"]
focus_pane_up = ["alt+k", "alt+up"]
focus_pane_right = ["prefix+l", "alt+l", "alt+right"]

# 标签页
new_tab = "ctrl+t"
previous_tab = "prefix+left"
next_tab = "prefix+right"
switch_tab = ["prefix+1..9", "alt+1..9", "ctrl+1..9"]
rename_tab = "prefix+shift+t"
close_tab = "prefix+shift+x"
move_tab_previous = "alt+i"
move_tab_next = "alt+o"

# 大小调整与历史输出
resize_mode = "alt+r"
edit_scrollback = "prefix+e"

# Herdr 的工作区与会话操作
new_workspace = "prefix+n"
# 内置导航会跨在线 machine，按侧栏顺序循环切换 Space。
previous_workspace = ["prefix+up", "prefix+k", "cmd+ctrl+["]
next_workspace = ["prefix+down", "prefix+j", "cmd+ctrl+]"]
previous_agent = "cmd+ctrl+k"
next_agent = "cmd+ctrl+j"
workspace_picker = "prefix+w"
goto = "prefix+g"
toggle_sidebar = "prefix+b"
detach = "prefix+q"
help = "prefix+?"

# 按列表顺序跳转 Space；9 始终跳到最后一个。
[[keys.command]]
key = "cmd+ctrl+1"
type = "shell"
command = 'python3 "$HOME/.config/herdr/focus-space.py" 1'
description = "切换到 Space 1"

[[keys.command]]
key = "cmd+ctrl+2"
type = "shell"
command = 'python3 "$HOME/.config/herdr/focus-space.py" 2'
description = "切换到 Space 2"

[[keys.command]]
key = "cmd+ctrl+3"
type = "shell"
command = 'python3 "$HOME/.config/herdr/focus-space.py" 3'
description = "切换到 Space 3"

[[keys.command]]
key = "cmd+ctrl+4"
type = "shell"
command = 'python3 "$HOME/.config/herdr/focus-space.py" 4'
description = "切换到 Space 4"

[[keys.command]]
key = "cmd+ctrl+5"
type = "shell"
command = 'python3 "$HOME/.config/herdr/focus-space.py" 5'
description = "切换到 Space 5"

[[keys.command]]
key = "cmd+ctrl+6"
type = "shell"
command = 'python3 "$HOME/.config/herdr/focus-space.py" 6'
description = "切换到 Space 6"

[[keys.command]]
key = "cmd+ctrl+7"
type = "shell"
command = 'python3 "$HOME/.config/herdr/focus-space.py" 7'
description = "切换到 Space 7"

[[keys.command]]
key = "cmd+ctrl+8"
type = "shell"
command = 'python3 "$HOME/.config/herdr/focus-space.py" 8'
description = "切换到 Space 8"

[[keys.command]]
key = "cmd+ctrl+9"
type = "shell"
command = 'python3 "$HOME/.config/herdr/focus-space.py" last'
description = "切换到最后一个 Space"
